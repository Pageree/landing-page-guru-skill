name: Check skill package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run package:skill
      - uses: actions/upload-artifact@v4
        with:
          name: landing-page-guru-skill
          path: |
            dist/*.skill
            dist/SHA256SUMS
